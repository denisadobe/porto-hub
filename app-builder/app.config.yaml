# Porto Serviço demo app (Adobe App Builder).
# Public web actions used by the storefront (Edge Delivery Services) in the service purchase journey:
#   coverage    GET  ?cep=&sku=                  is the CEP served? + address from ViaCEP
#   slots       GET  ?cep=&sku=&days=            available days/shifts for the region
#   reserve     POST {cep, sku, date, shift}     holds a slot for a few minutes
#   release     POST {reservationId}             frees a held slot
#   reservation GET  ?id=                        reservation status
application:
  runtimeManifest:
    packages:
      porto-servico:
        license: Apache-2.0
        actions:
          coverage:
            function: actions/coverage/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
          slots:
            function: actions/slots/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
          reserve:
            function: actions/reserve/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
          release:
            function: actions/release/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
          reservation:
            function: actions/reservation/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
          # Simulated Pix PSP (demo): charge with a real-format BR Code + automatic "payment"
          pix-charge:
            function: actions/pix-charge/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
          pix-status:
            function: actions/pix-status/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
          # Commerce webhooks (System > Webhooks > Webhooks Subscriptions). raw-http keeps the
          # original body for the signature check; the public key comes from
          # Stores > Configuration > Adobe Services > Webhooks (commerce-webhook-public-key.pem).
          webhook-order-validate:
            function: actions/webhook-order-validate/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              COMMERCE_WEBHOOK_PUBLIC_KEY: $COMMERCE_WEBHOOK_PUBLIC_KEY
              REQUIRE_BOOKING: 'true'
            annotations:
              require-adobe-auth: false
              raw-http: true
              final: true
          webhook-order-placed:
            function: actions/webhook-order-placed/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              COMMERCE_WEBHOOK_PUBLIC_KEY: $COMMERCE_WEBHOOK_PUBLIC_KEY
            annotations:
              require-adobe-auth: false
              raw-http: true
              final: true
          webhook-order-cancel:
            function: actions/webhook-order-cancel/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              COMMERCE_WEBHOOK_PUBLIC_KEY: $COMMERCE_WEBHOOK_PUBLIC_KEY
            annotations:
              require-adobe-auth: false
              raw-http: true
              final: true
          webhook-log:
            function: actions/webhook-log/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true
extensions:
  # This extension is required for Admin UI. Do not remove.
  commerce/backend-ui/2:
    $include: src/commerce-backend-ui-2/ext.config.yaml

  # This extension is required for app management. Do not remove.
  commerce/extensibility/1:
    $include: src/commerce-extensibility-1/ext.config.yaml
